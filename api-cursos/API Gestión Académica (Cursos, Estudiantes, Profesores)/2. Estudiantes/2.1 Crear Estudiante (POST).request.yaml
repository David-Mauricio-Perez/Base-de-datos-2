$kind: http-request
url: "{{baseUrl}}/estudiantes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Laura Morales",
      "edad": 21,
      "email": "laura_{{$timestamp}}@mail.com",
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 201 (Creado)', function () { pm.response.to.have.status(201); });
      const res = pm.response.json();
      pm.test('Devuelve el ID del estudiante generado', function () { pm.expect(res).to.have.property('_id'); });
      if (res._id) { pm.collectionVariables.set('estudianteId', res._id); }
    language: text/javascript
order: 1000
