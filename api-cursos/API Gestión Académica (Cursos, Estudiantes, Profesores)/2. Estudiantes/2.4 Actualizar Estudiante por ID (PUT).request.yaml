$kind: http-request
url: "{{baseUrl}}/estudiantes/{{estudianteId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "edad": 22
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200 (OK)', function () { pm.response.to.have.status(200); });
      pm.test('Verifica actualización de edad', function () { const res = pm.response.json(); pm.expect(res.edad).to.eql(22); });
    language: text/javascript
order: 4000
