$kind: http-request
url: "{{baseUrl}}/profesores/{{profesorId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "departamento": "Ciencias de la Computación e Inteligencia Artificial"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200 (OK)', function () { pm.response.to.have.status(200); });
      pm.test('Verifica actualización de departamento', function () { const res = pm.response.json(); pm.expect(res.departamento).to.include('Inteligencia Artificial'); });
    language: text/javascript
order: 4000
