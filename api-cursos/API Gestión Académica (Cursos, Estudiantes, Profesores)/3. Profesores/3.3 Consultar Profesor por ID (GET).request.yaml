$kind: http-request
url: "{{baseUrl}}/profesores/{{profesorId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200 (OK)', function () { pm.response.to.have.status(200); });
      pm.test('Coincide el ID consultado', function () { const res = pm.response.json(); pm.expect(res._id).to.eql(pm.collectionVariables.get('profesorId')); });
    language: text/javascript
order: 3000
