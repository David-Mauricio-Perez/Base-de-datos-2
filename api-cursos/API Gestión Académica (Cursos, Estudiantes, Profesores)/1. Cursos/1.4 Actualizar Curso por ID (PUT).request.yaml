$kind: http-request
url: "{{baseUrl}}/cursos/{{cursoId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "creditos": 4,
      "nombre": "Bases de Datos Avanzadas"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200 (OK)', function () { pm.response.to.have.status(200); });
      pm.test('Verifica campos actualizados', function () { const res = pm.response.json(); pm.expect(res.creditos).to.eql(4); });
    language: text/javascript
order: 4000
