$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () { pm.response.to.have.status(200); });
      pm.test('Retorna info de la API', function () { const data = pm.response.json(); pm.expect(data).to.have.property('nombre'); });
    language: text/javascript
order: 1000
